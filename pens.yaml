# pens.yaml — the pens manifest (tracked in the pens repo; the actual pen trees are git-ignored).
# The pens repo on GitHub is the REGISTRY/pointers, not the code. Each pen's contents
# live locally under /home/toxic/pens/<pen>/ and are ignored here.
# Regenerate pen entries with: pensctl add <pen>

pens:
  ranch: # the 169-component workspace pen
    type: git-superproject # local checkout; components tracked by .meta.yaml remotes
    remote: "https://github.com/toxicwind/ranch" # the ranch superproject (pointers)
    manifest: ".meta.yaml" # component -> repo mapping (the no-submodule mechanism)
    components: "ranch/.meta.yaml" # authoritative list of the 169 component repos
  olympus: # the Greek-coded pantheon registry pen (fully local, non-GitHub)
    type: local-registry # pure local dir, no remote of its own
    role: "Greek pantheon: tau, kappa, skopos, kilo, muse, keryx, hodos, kairos, kryptos"
    registry: "olympus/README.md" # the pantheon table mapping codename -> physical repo
  archive: # junk / recovered artifacts
    type: local-dir

convention:
  - "pens is the pointer repo; it tracks pens.yaml, pensctl, .gitignore only."
  - "Every pen dir is git-ignored at the pens root (*), so pens is never a monorepo."
  - "Each ranch component has its own GitHub remote (toxicwind/<name>), listed in ranch/.meta.yaml."
  - "No submodules anywhere: the manifest (.meta.yaml) replaces git-submodule churn."
